name: LEMS build verification
on:
  pull_request:
    branches: [railway/react-migration]
  push:
    branches: [lems-admin-student-accounts]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --prefix backend --package-lock=false
      - name: Check backend JavaScript syntax
        run: node --check backend/server.js
      - name: Install frontend dependencies
        run: npm install --prefix frontend-react --package-lock=false
      - name: Build frontend
        run: npm --prefix frontend-react run build
