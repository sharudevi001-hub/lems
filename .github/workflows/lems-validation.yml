name: LEMS validation

on:
  pull_request:
    branches:
      - railway/react-migration
  push:
    branches:
      - lems/full-spec-staged-implementation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend-react/package-lock.json
      - name: Install backend dependencies and refresh lockfile
        working-directory: backend
        run: npm install
      - name: Install frontend dependencies and refresh lockfile
        working-directory: frontend-react
        run: npm install
      - name: Commit refreshed lockfiles on feature-branch pushes
        if: github.event_name == 'push' && github.ref_name == 'lems/full-spec-staged-implementation'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend-react/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already up to date."
          else
            git commit -m "chore: refresh npm lockfiles"
            git push
          fi
      - name: Check backend JavaScript syntax
        working-directory: backend
        run: node --check server.js
      - name: Build frontend
        working-directory: frontend-react
        run: npm run build
